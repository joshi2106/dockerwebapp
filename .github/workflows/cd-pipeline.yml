name: CD Pipeline
# WHEN does this run? Only after CI Pipeline succeeds!
on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
    branches:
      - master

jobs:
  deploy:
    # Only actually run if CI passed (not if it failed)
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      # STEP 1: Get the code (needed to access manifests/ folder)
      - name: Checkout code
        uses: actions/checkout@v4

      # STEP 2: Set up AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # STEP 3: Connect kubectl to your EKS cluster
      # This is the same thing you did manually earlier, but automated
      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region us-east-1 --name EKS_CLOUD

      # STEP 4: Deploy - "Send all manifest files to Kubernetes"
      # kubectl apply reads your YAML files and creates/updates everything
      - name: Deploy to EKS
        run: kubectl apply -f manifests/ -n webapps

      # STEP 5: Verify - "Did it actually work?"
      - name: Verify deployment
        run: kubectl get all -n webapps
