name: CI Pipeline

on:
  push:
    branches: [ master ]

jobs:

  # ────────────────────────────────────────
  # JOB 1 — BUILD, TEST, SCAN, PUSH
  # ────────────────────────────────────────
  build:
    name: Build and Push
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Copy WAR to Docker folder
        run: cp -r target Docker-app

      - name: SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: mvn sonar:sonar -Dsonar.projectKey=webapps

      - name: OWASP dependency check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'MyProject'
          path: '.'
          format: 'HTML'

      - name: Build Docker images
        run: |
          docker build -t appimage Docker-app
          docker build -t dbimage Docker-db

      - name: Trivy scan
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy image appimage
          trivy image dbimage

      - name: Push to Docker Hub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
          docker tag appimage $DOCKER_USERNAME/socialmedia:app
          docker tag dbimage  $DOCKER_USERNAME/socialmedia:db
          docker push $DOCKER_USERNAME/socialmedia:app
          docker push $DOCKER_USERNAME/socialmedia:db

      - name: Upload artifact to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          aws s3 cp target/vprofile-v2.war s3://YOUR-BUCKET-NAME/vprofile-v2.war

  # ────────────────────────────────────────
  # JOB 2 — DEPLOY TO EKS
  # only runs if Job 1 fully passes
  # ────────────────────────────────────────
  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: build          # ← waits for build job to pass first
                          # if build fails, this job never starts

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install kubectl
        run: |
          curl -LO https://dl.k8s.io/release/v1.32.0/bin/linux/amd64/kubectl
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/
          kubectl version --client

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Connect kubectl to EKS
        run: |
          aws eks update-kubeconfig --region us-east-1 --name EKS_CLOUD

      - name: Deploy to Kubernetes
        run: kubectl apply -f manifests/ -n webapps

      - name: Verify deployment
        run: kubectl get all -n webapps
