name: CI Pipeline

# WHEN does this run? Every time you push to the main branch
on:
  push:
    branches: [ master ]

jobs:
  build-and-push:
    # WHERE does it run? On GitHub's own Linux machines (free!)
    runs-on: ubuntu-latest

    steps:
      # STEP 1: Checkout - "Robot, download my code"
      - name: Checkout code
        uses: actions/checkout@v4

      # STEP 2: Set up Java - "Robot, install Java 17"
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # STEP 3: Build with Maven - "Robot, compile and package"
      # This creates target/vprofile-v2.war (your app, packaged)
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # STEP 4: Copy WAR to Docker folder - "Robot, put the app where Docker can see it"
      - name: Copy artifact to Docker folder
        run: cp -r target Docker-app

      # STEP 5: SonarQube - "Robot, check if my code is bad quality"
      # SonarQube is like Grammarly, but for code
      - name: SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}       # stored in GitHub Secrets
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }} # your SonarQube server URL
        run: mvn sonar:sonar -Dsonar.projectKey=mediaapp

      # STEP 6: OWASP Dependency Check - "Robot, check if any libraries have known hacks"
      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'MyProject'
          path: '.'
          format: 'HTML'
        env:
          JAVA_HOME: /opt/jdk

      # STEP 7: Build Docker images - "Robot, pack the app into a container"
      # A Docker image is like a USB stick with everything pre-installed
      - name: Build Docker images
        run: |
          docker build -t appimage Docker-app
          docker build -t dbimage Docker-db

      # STEP 8: Trivy scan - "Robot, scan Docker images for security holes"
      - name: Trivy vulnerability scan
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy image appimage
          trivy image dbimage

      # STEP 9: Tag and Push to Docker Hub - "Robot, upload images to Docker Hub"
      # Docker Hub = GitHub, but for Docker images
      - name: Tag and push to Docker Hub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
          docker tag appimage $DOCKER_USERNAME/socialmedia:app
          docker tag dbimage $DOCKER_USERNAME/socialmedia:db
          docker push $DOCKER_USERNAME/socialmedia:app
          docker push $DOCKER_USERNAME/socialmedia:db

      # STEP 10: Upload .war to S3 - "Robot, store a backup of the build"
      - name: Upload artifact to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          aws s3 cp target/vprofile-v2.war s3://joshi.k8s.dev/vprofile-v2.war
